services:
  - type: web
    name: bygigabit
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: bygigabit-db
          property: connectionString
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: bygigabit-db
    databaseName: bygigabit
    user: bygigabit_user
    region: frankfurt
    plan: free
